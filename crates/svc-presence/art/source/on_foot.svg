<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256">
  <!-- Starlume Rich Presence icon "on_foot": lucide footprints (ISC), the glyph
       the app uses, as a holo line on the app icon's graphite. Discord shows
       the small image as a circle, so the surface is a disc. -->
