[package]
name = "svc-data"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
description = "Starlume data service — one shared DCB parse + snapshot cache per build"

[dependencies]
# The umbrella pin lands here, nowhere else (see workspace root for the
# one-pin rule). `foundations` = items, tags, manufacturers, resources,
# locations, gathering + RecordPaths — the HolotableSnapshot bundle.
# `missions-payout` adds the contracts pipeline + the DCB-read UecCurve for
# the mission catalog cook. `weapons` adds sc-weapons (ship weapons +
# missiles) for the weapons-index cook. `mining` adds sc-mining + the mining
# item sheets for the mining-index cook. `vehicles` adds sc-vehicles (hulls,
# ports, loadouts, the power network) for the ships-index cook. `visuals`
# adds the render recipes the ship holo assembles from.
sc-holotable = { workspace = true, features = ["foundations", "missions-payout", "weapons", "crafting", "mining", "vehicles", "visuals"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
