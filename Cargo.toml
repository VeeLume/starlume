[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/app-kit",
    "crates/mod-contracts",
    "crates/mod-crafting",
    "crates/mod-devtracker",
    "crates/mod-items",
    "crates/mod-langpatch",
    "crates/mod-mining",
    "crates/mod-plans",
    "crates/mod-session",
    "crates/mod-ships",
    "crates/server",
    "crates/svc-discovery",
    "crates/svc-data",
    "crates/svc-capture",
    "crates/svc-commlinks",
    "crates/svc-dossier",
    "crates/svc-patchnotes",
    "crates/svc-presence",
    "crates/svc-shipstore",
    "crates/svc-uex",
    "crates/svc-log",
    "crates/svc-spectrum",
    "crates/svc-sync",
    "crates/svc-telemetry",
]

[workspace.package]
version = "0.6.0"
authors = ["Valerie"]
license = "MIT"
edition = "2024"
repository = "https://github.com/VeeLume/starlume"

[workspace.dependencies]
# Generic
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tokio = { version = "1", features = ["full"] }
url = "2"
dirs = "6"
chrono = "0.4"
# RSI public-profile parsing (svc-discovery) — pure HTML parsing, no HTTP.
scraper = "0.20"

# The SC data backbone — ONE pin for the whole app (the whole point of the
# consolidation). Base features here; svc-data adds `foundations` on the same
# pin (Cargo unions features across the workspace).
sc-holotable = { git = "https://github.com/VeeLume/sc-holotable.git", tag = "sc-holotable/v0.58.2", features = ["installs"] }
# The gRPC lab's shipped client: game services, Spectrum, patch notes,
# comm-links. ONE
# pin for every service that uses it. `telemetry` adds the game's local
# stream (loopback only) for svc-telemetry.
sc-dossier = { git = "https://github.com/VeeLume/sc-dossier", tag = "v0.16.0", features = ["telemetry"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
# Session captures (svc-telemetry::capture): gzip blocks. Already in the
# tree through other crates.
flate2 = "1"

# Device-token storage in Windows Credential Manager (the fleetsync pattern).
keyring = { version = "3", features = ["windows-native"] }

# HTTP client — desktop (token exchange, /api/me) and server (Discord OAuth).
# rustls-tls keeps Windows builds clean of OpenSSL (the Hearth pattern).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Server stack (crates/server) — the planned axum + sqlx + SQLite shape.
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"

# Type-safe Tauri IPC + TypeScript bindings (matches Hearth / sc-langpatch).
specta = { version = "2.0.0-rc.21", features = ["derive"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "2.0.0-rc.21", features = ["typescript"] }

# Internal crates
app-kit = { path = "crates/app-kit" }
mod-contracts = { path = "crates/mod-contracts" }
mod-crafting = { path = "crates/mod-crafting" }
mod-devtracker = { path = "crates/mod-devtracker" }
mod-items = { path = "crates/mod-items" }
mod-langpatch = { path = "crates/mod-langpatch" }
mod-mining = { path = "crates/mod-mining" }
mod-plans = { path = "crates/mod-plans" }
mod-session = { path = "crates/mod-session" }
mod-ships = { path = "crates/mod-ships" }
sc-render = { git = "https://github.com/VeeLume/sc-render", tag = "v0.6.15" }
tauri-plugin-sc-render = { git = "https://github.com/VeeLume/sc-render", tag = "v0.6.15" }
svc-discovery = { path = "crates/svc-discovery" }
svc-data = { path = "crates/svc-data" }
svc-capture = { path = "crates/svc-capture" }
# Glyph matching (the HUD reader's text): sc-nav's crate, pinned by commit
# until sc-nav has a stable v0.1.0 (Valerie, 2026-11-16).
sc-nav-glyph = { git = "https://github.com/VeeLume/sc-nav", rev = "49dd267cb61f708bc1df2854c0e04a4e22e94172" }
svc-commlinks = { path = "crates/svc-commlinks" }
svc-dossier = { path = "crates/svc-dossier" }
svc-patchnotes = { path = "crates/svc-patchnotes" }
svc-presence = { path = "crates/svc-presence" }
svc-shipstore = { path = "crates/svc-shipstore" }
svc-uex = { path = "crates/svc-uex" }
svc-log = { path = "crates/svc-log" }
svc-spectrum = { path = "crates/svc-spectrum" }
svc-sync = { path = "crates/svc-sync" }
svc-telemetry = { path = "crates/svc-telemetry" }

# TOML parsing (mod-langpatch's embedded curated patchers).
toml = "0.8"
# The dev tracker's content filter (mod-devtracker).
regex = "1"

# The cook (p4k read, DataCore parse, sc-holotable's indexes, decompression)
# is dependency code: unoptimised it took over 20 minutes under `tauri dev`.
# Optimise every dependency and the crate that drives the cook. The app's
# other crates stay unoptimised, so they keep compiling fast; the cost is one
# longer first build.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.svc-data]
opt-level = 3

# The mining simulation runs thousands of ticks per try and dozens of tries
# per rating: unoptimised it turns a recalculation into a long wait.
[profile.dev.package.mod-mining]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Release speed with line tables, so a profiler can name functions:
# `cargo test --profile profiling …`, `samply record …`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
