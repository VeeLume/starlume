[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/app-kit",
    "crates/mod-contracts",
    "crates/mod-devtracker",
    "crates/mod-items",
    "crates/mod-langpatch",
    "crates/server",
    "crates/svc-discovery",
    "crates/svc-data",
    "crates/svc-commlinks",
    "crates/svc-dossier",
    "crates/svc-patchnotes",
    "crates/svc-log",
    "crates/svc-spectrum",
    "crates/svc-sync",
]

[workspace.package]
version = "0.2.0"
authors = ["Valerie"]
license = "MIT"
edition = "2024"
repository = "https://github.com/VeeLume/starlume"

[workspace.dependencies]
# Generic
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tokio = { version = "1", features = ["full"] }
url = "2"
dirs = "6"
chrono = "0.4"
# RSI public-profile parsing (svc-discovery) — pure HTML parsing, no HTTP.
scraper = "0.20"

# The SC data backbone — ONE pin for the whole app (the whole point of the
# consolidation). Base features here; svc-data adds `foundations` on the same
# pin (Cargo unions features across the workspace).
sc-holotable = { git = "https://github.com/VeeLume/sc-holotable.git", tag = "sc-holotable/v0.19.0", features = ["installs"] }
# The gRPC lab's shipped client: game services, Spectrum, patch notes,
# comm-links. ONE
# pin for every service that uses it.
sc-dossier = { git = "https://github.com/VeeLume/sc-dossier", tag = "v0.10.0" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

# Device-token storage in Windows Credential Manager (the fleetsync pattern).
keyring = { version = "3", features = ["windows-native"] }

# HTTP client — desktop (token exchange, /api/me) and server (Discord OAuth).
# rustls-tls keeps Windows builds clean of OpenSSL (the Hearth pattern).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Server stack (crates/server) — the planned axum + sqlx + SQLite shape.
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"

# Type-safe Tauri IPC + TypeScript bindings (matches Hearth / sc-langpatch).
specta = { version = "2.0.0-rc.21", features = ["derive"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "2.0.0-rc.21", features = ["typescript"] }

# Internal crates
app-kit = { path = "crates/app-kit" }
mod-contracts = { path = "crates/mod-contracts" }
mod-devtracker = { path = "crates/mod-devtracker" }
mod-items = { path = "crates/mod-items" }
mod-langpatch = { path = "crates/mod-langpatch" }
svc-discovery = { path = "crates/svc-discovery" }
svc-data = { path = "crates/svc-data" }
svc-commlinks = { path = "crates/svc-commlinks" }
svc-dossier = { path = "crates/svc-dossier" }
svc-patchnotes = { path = "crates/svc-patchnotes" }
svc-log = { path = "crates/svc-log" }
svc-spectrum = { path = "crates/svc-spectrum" }
svc-sync = { path = "crates/svc-sync" }

# TOML parsing (mod-langpatch's embedded curated patchers).
toml = "0.8"
# The dev tracker's content filter (mod-devtracker).
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
